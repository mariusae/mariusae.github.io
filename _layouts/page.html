---
layout: default
---
<article class="post">
  <header class="post-header canvas">
    <div class="post-meta">
      <a class="post-back" href="{{ '/' | relative_url }}" aria-label="Home">
        <svg viewBox="0 0 8 12" width="6" height="9" aria-hidden="true"><path d="M6.5 1.5 2 6l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Home</span>
      </a>
      {% if page.draft %}<span class="post-draft">Draft</span>{% endif %}
    </div>
    <h1 class="post-title">{{ page.heading | default: page.title }}</h1>
  </header>
  <div class="content canvas">
    {{ content }}
  </div>
</article>
