<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Source+Code+Pro:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="site">
    <main class="site-content">
      {{ content }}
    </main>
    <footer class="site-foot canvas">
      <span>&copy; {{ site.time | date: '%Y' }} {{ site.author }}</span>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </footer>
  </div>
</body>
</html>
